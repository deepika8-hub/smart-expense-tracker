<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard — Smart Expense Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
  <span class="navbar-brand">💰 Smart Expense Tracker</span>
  <div>
    <span id="welcomeUser" class="text-white me-3"></span>
    <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="container mt-4">
  <div class="row">
    <div class="col-md-5">
      <div class="card p-3 mb-3">
        <h5 id="formTitle">Add Expense</h5>
        <input type="hidden" id="editingId">
        <input class="form-control mb-2" id="title" placeholder="Title">
        <input class="form-control mb-2" id="amount" type="number" step="0.01" placeholder="Amount">
        <select class="form-control mb-2" id="currency">
          <option>USD</option><option>INR</option><option>EUR</option>
          <option>GBP</option><option>JPY</option><option>AUD</option>
        </select>
        <input class="form-control mb-2" id="category" placeholder="Category (e.g. Food, Travel)">
        <input class="form-control mb-2" id="date" type="date">
        <button class="btn btn-primary" onclick="saveExpense()">Save</button>
      </div>

      <div class="card p-3">
        <h5>Filter by Month</h5>
        <div class="d-flex gap-2">
          <input class="form-control" id="filterYear" type="number" placeholder="Year" value="2026">
          <select class="form-control" id="filterMonth">
            <option value="1">Jan</option><option value="2">Feb</option><option value="3">Mar</option>
            <option value="4">Apr</option><option value="5">May</option><option value="6">Jun</option>
            <option value="7">Jul</option><option value="8">Aug</option><option value="9">Sep</option>
            <option value="10">Oct</option><option value="11">Nov</option><option value="12">Dec</option>
          </select>
        </div>
        <button class="btn btn-secondary mt-2" onclick="loadByMonth()">Filter</button>
        <button class="btn btn-link mt-1" onclick="loadAll()">Show All</button>
      </div>
    </div>

    <div class="col-md-7">
      <div class="card p-3 mb-3">
        <h5>Summary</h5>
        <p>Total: $<span id="totalUSD">0</span></p>
        <canvas id="categoryChart" height="180"></canvas>
      </div>

      <div class="card p-3">
        <h5>Expenses</h5>
        <table class="table table-sm">
          <thead><tr><th>Title</th><th>Amount</th><th>Category</th><th>Date</th><th></th></tr></thead>
          <tbody id="expenseTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="dashboard.js"></script>
<script src="charts.js"></script>
</body>
</html>
