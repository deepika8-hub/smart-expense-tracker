<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Expense Tracker — Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
<div class="container d-flex align-items-center justify-content-center min-vh-100">
  <div class="card p-4 shadow-sm" style="max-width:400px;width:100%;">
    <h3 class="mb-3 text-center">💰 Smart Expense Tracker</h3>

    <ul class="nav nav-tabs mb-3" id="authTabs">
      <li class="nav-item"><button class="nav-link active" data-tab="login">Login</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="register">Register</button></li>
    </ul>

    <div id="loginForm">
      <input class="form-control mb-2" id="loginUsername" placeholder="Username">
      <input class="form-control mb-2" id="loginPassword" type="password" placeholder="Password">
      <button class="btn btn-primary w-100" onclick="login()">Log In</button>
    </div>

    <div id="registerForm" class="d-none">
      <input class="form-control mb-2" id="regUsername" placeholder="Username">
      <input class="form-control mb-2" id="regEmail" type="email" placeholder="Email">
      <input class="form-control mb-2" id="regPassword" type="password" placeholder="Password (min 6 chars)">
      <button class="btn btn-success w-100" onclick="register()">Create Account</button>
    </div>

    <div id="authError" class="text-danger mt-2 small"></div>
  </div>
</div>
<script src="auth.js"></script>
</body>
</html>
